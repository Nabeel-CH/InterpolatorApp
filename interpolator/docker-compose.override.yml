services:
  backend:
    build:
      target: development
    volumes:
      - ./backend:/app:delegated
      - /app/__pycache__
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
    command: >
      uvicorn main:app
      --host 0.0.0.0
      --port 8000
      --reload

  frontend:
    build:
      target: development
    volumes:
      - ./frontend:/app:delegated
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - NEXT_TELEMETRY_DISABLED=1
      - NEXT_PUBLIC_API_URL=http://localhost:8000